version: '3.8'
services:
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: pterodactyl-panel
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_URL=https://${CODESPACE_NAME}-80.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=pterodactyl
      - DB_USERNAME=pterodactyl
      - DB_PASSWORD=pterodactyl123
      - REDIS_HOST=redis
    volumes:
      - panel_data:/var/www/html/storage
      - ./storage/var/www/html/public:/var/www/html/public
    depends_on:
      - database
      - redis

  database:
    image: mariadb:10.5
    container_name: pterodactyl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: pterodactyl
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: pterodactyl123
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: pterodactyl-redis
    restart: unless-stopped

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: pterodactyl-wings
    restart: unless-stopped
    command: wings --debug
    ports:
      - "8080:8080"
      - "2022:2022"
    environment:
      - WINGS_DEBUG=true
      - WINGS_UUID=${CODESPACE_NAME}-wings
      - WINGS_TOKEN=wings_token_${CODESPACE_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wings_data:/var/lib/pterodactyl
    depends_on:
      - panel

volumes:
  panel_data:
  mariadb_data:
  wings_data:
